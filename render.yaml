services:
  - type: web
    name: iglesia-asistencia
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: iglesia-asistencia-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: iglesia-asistencia-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: iglesia-asistencia-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: iglesia-asistencia-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: iglesia-asistencia-db
          property: password
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
    preDeployCommand: php artisan migrate --force

databases:
  - name: iglesia-asistencia-db
    plan: free
